name: Install Moonraker on Debian 12
vm: debian12-kiauh
os: debian-12
steps:
  - command: ["kiauh", "install", "klipper", "--count", "1"]
    timeout: 600
  - command: ["kiauh", "install", "moonraker"]
    timeout: 600
expected:
  - type: service
    name: moonraker.service
    state: running
  - type: file
    path: /home/kiauh/moonraker/moonraker
    exists: true
